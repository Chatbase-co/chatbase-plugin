name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Expected layout files are present
        run: |
          for f in \
            .claude-plugin/marketplace.json \
            plugins/chatbase/.claude-plugin/plugin.json \
            plugins/chatbase/.codex-plugin/plugin.json \
            plugins/chatbase/.mcp.json \
            plugins/chatbase/assets/icon.png \
            plugins/chatbase/skills/chatbase/SKILL.md \
            plugins/chatbase/skills/chatbase/SKILL.md.sha256; do
              test -f "$f" || { echo "missing required file: $f"; exit 1; }
          done

      - name: Every JSON parses
        run: |
          for f in $(find . -name '*.json' -not -path './.git/*'); do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "invalid JSON: $f"; exit 1; }
          done

      - name: Manifests carry the required fields and agree on version
        run: |
          node -e "
          const fs = require('fs');
          const cc = JSON.parse(fs.readFileSync('plugins/chatbase/.claude-plugin/plugin.json','utf8'));
          const cx = JSON.parse(fs.readFileSync('plugins/chatbase/.codex-plugin/plugin.json','utf8'));
          for (const [label, m] of [['claude', cc], ['codex', cx]]) {
            for (const field of ['name','version','description']) {
              if (!m[field]) { console.error(label + ' manifest missing ' + field); process.exit(1); }
            }
            if (!/^\d+\.\d+\.\d+$/.test(m.version)) { console.error(label + ' version not semver'); process.exit(1); }
          }
          if (cc.version !== cx.version) { console.error('manifest versions disagree: ' + cc.version + ' vs ' + cx.version); process.exit(1); }
          "

      - name: Server config points at production and ships no credential
        run: |
          node -e "
          const cfg = JSON.parse(require('fs').readFileSync('plugins/chatbase/.mcp.json','utf8'));
          const s = cfg.mcpServers && cfg.mcpServers.chatbase;
          if (!s) { console.error('no chatbase server entry'); process.exit(1); }
          if (s.url !== 'https://mcp.chatbase.co/api/mcp') { console.error('wrong url: ' + s.url); process.exit(1); }
          const blob = JSON.stringify(cfg).toLowerCase();
          for (const bad of ['authorization','token','bearer','api_key','apikey','secret']) {
            if (blob.includes(bad)) { console.error('config appears to carry a credential: ' + bad); process.exit(1); }
          }
          "

      - name: Generated skill has not been hand-edited
        run: |
          test -f plugins/chatbase/skills/chatbase/SKILL.md.sha256 || {
            echo 'checksum sidecar missing'; exit 1; }
          expected=$(cat plugins/chatbase/skills/chatbase/SKILL.md.sha256)
          actual=$(sha256sum plugins/chatbase/skills/chatbase/SKILL.md | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "SKILL.md does not match its checksum."
            echo "It is generated from docs/mcp/SKILL.md in the chatbase repo."
            echo "Edit it there; the sync will republish it here."
            exit 1
          fi
